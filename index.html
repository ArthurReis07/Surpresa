<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite para Alayne</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial, sans-serif;
  background:#eef5ec;
  color:#26382e;
  overflow: hidden;
}
.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:32px 26px;
  text-align:center;
  box-shadow:0 8px 25px rgba(35,70,48,.10);
}
.small{
  color:#4d805f;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
}
h1{
  margin:12px 0 8px;
  font-family:Georgia,serif;
  font-size:48px;
  color:#285b3b;
  font-weight:normal;
}
.intro{
  margin:0 auto 25px;
  line-height:1.6;
  color:#65736a;
}
.info{
  border-top:1px solid #e5ece5;
  border-bottom:1px solid #e5ece5;
  padding:20px 0;
  margin-bottom:22px;
}
.item{
  margin:14px 0;
}
.label{
  display:block;
  font-size:12px;
  color:#78917e;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.7px;
}
.value{
  font-size:19px;
  font-weight:bold;
  color:#294b35;
}
.calendar{
  background:#f5f9f3;
  border-radius:14px;
  padding:15px;
  margin-bottom:22px;
}
.month{
  font-weight:bold;
  color:#356a47;
  margin-bottom:12px;
  text-transform:capitalize;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  font-size:12px;
}
.day{
  padding:7px 2px;
  border-radius:8px;
  transition: all 0.2s ease;
}
.today{
  background:#3d7850;
  color:white;
  font-weight:bold;
}
.past {
  color: #b5c4ba;
  cursor: not-allowed;
}
.selectable {
  cursor: pointer;
}
.selectable:hover {
  background: #d4e0d7;
  transform: scale(1.1);
}
.selected {
  background: #285b3b !important;
  color: white !important;
  font-weight: bold;
  transform: scale(1.15) !important;
  box-shadow: 0 4px 10px rgba(40,91,59,0.3);
}
.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  position: relative;
  min-height: 42px; 
}
button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
.yes{
  background:#356d47;
  color:white;
  z-index: 2;
}
.yes:hover{background:#2b5c3a}
.no{
  background:#edf1ed;
  color:#5e6b62;
  transition: top 0.2s ease, left 0.2s ease;
  z-index: 100;
}
.message{
  min-height:24px;
  margin-top:16px;
  font-size:14px;
  color:#356d47;
  font-weight:bold;
}
.footer{
  margin-top:24px;
  font-size:11px;
  color:#9aa69d;
}
@media(max-width:430px){
  h1{font-size:42px}
  .card{padding:28px 21px}
}
</style>
</head>

<body>
<div class="card">
  <div class="small">Um convite para você</div>

  <h1>Alayne</h1>

  <p class="intro">
    Pensei que seria uma boa ideia trocar mensagens por uma conversa pessoalmente.
    E, de preferência, acompanhada de uma comida boa. :)
  </p>

  <div class="info">
    <div class="item">
      <span class="label">Evento</span>
      <span class="value">Jantar</span>
    </div>

    <div class="item">
      <span class="label">Local</span>
      <span class="value">Manzuco</span>
    </div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="buttons">
    <button class="yes" id="yes">Aceito o convite</button>
    <button class="no" id="no">Vou pensar</button>
  </div>

  <div class="message" id="message"></div>

  <div class="footer">O convite foi feito. Agora a resposta é com você. 🌿</div>
</div>

<script>
// ==========================================
// INSIRA O SEU NÚMERO DE WHATSAPP AQUI ABAIXO:
// Formato: 55 + DDD + Número (Apenas números)
// Exemplo: 5573999999999
const SEU_NUMERO_WHATSAPP = "73982027253"; 
// ==========================================

const calendar = document.getElementById("calendar");
const message = document.getElementById("message");
const now = new Date();
const year = now.getFullYear();
const month = now.getMonth();
const today = now.getDate();

const monthName = now.toLocaleDateString("pt-BR", {
  month:"long",
  year:"numeric"
});

const week = ["D","S","T","Q","Q","S","S"];
const firstDay = new Date(year, month, 1).getDay();
const totalDays = new Date(year, month + 1, 0).getDate();

let content = `<div class="month">${monthName}</div><div class="days">`;

week.forEach(d => content += `<strong>${d}</strong>`);

for(let i=0;i<firstDay;i++) content += "<span></span>";

for(let d=1; d<=totalDays; d++){
  let extraClass = "";
  if(d < today) {
    extraClass = " past"; 
  } else if (d === today) {
    extraClass = " today selectable"; 
  } else {
    extraClass = " selectable"; 
  }
  content += `<span class="day${extraClass}" data-day="${d}">${d}</span>`;
}
content += "</div>";
calendar.innerHTML = content;

let diaSelecionado = null;
const selectableDays = document.querySelectorAll('.selectable');

selectableDays.forEach(dayNode => {
  dayNode.addEventListener('click', function() {
    selectableDays.forEach(n => n.classList.remove('selected'));
    this.classList.add('selected');
    diaSelecionado = this.getAttribute('data-day');
    message.textContent = `Dia ${diaSelecionado}? Perfeito. Confirme clicando em "Aceito o convite"! 👇`;
  });
});

const yes = document.getElementById("yes");
const no = document.getElementById("no");

function victorySound(){
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if(!AudioContext) return;

  const ctx = new AudioContext();
  const notes = [
    [523.25,0.00,0.16], [659.25,0.16,0.16],
    [783.99,0.32,0.16], [1046.50,0.48,0.42]
  ];

  notes.forEach(([freq,start,duration])=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + duration + 0.03);
  });

  setTimeout(()=>ctx.close(), 1500);
}

// --- CLIQUE NO BOTÃO DE ACEITAR E RETORNO VIA WHATSAPP ---
yes.onclick = () => {
  victorySound();
  
  let textoWhatsapp = "";

  if (diaSelecionado) {
    message.textContent = `Fechado! Redirecionando para o WhatsApp... 📲`;
    textoWhatsapp = `Oi! Eu aceito o convite pro Manzuco! 😉 Podemos ir no dia ${diaSelecionado}. Que horas a gente se encontra?`;
  } else {
    message.textContent = `Fechado! Redirecionando para o WhatsApp... 📲`;
    textoWhatsapp = `Oi! Eu aceito o convite pro Manzuco! 😉 Vamos marcar o dia e horário?`;
  }
  
  yes.textContent = "Fechado! ✓";
  yes.style.transform = "scale(1.05)";
  no.style.display = "none";
  
  setTimeout(()=>yes.style.transform="scale(1)",180);

  // Redireciona para o WhatsApp após 2 segundos
  setTimeout(() => {
    const url = `https://wa.me/${73982027253}?text=${encodeURIComponent(textoWhatsapp)}`;
    window.location.href = url; // Usa location.href para funcionar bem no celular
  }, 2000);
};

// --- LÓGICA DO BOTÃO FUJÃO ---
function fugirBotao(e) {
  if(e && e.type === 'touchstart') {
    e.preventDefault();
  }
  no.style.position = "fixed";
  const maxX = window.innerWidth - no.offsetWidth - 20;
  const maxY = window.innerHeight - no.offsetHeight - 20;
  const randomX = Math.floor(Math.random() * maxX) + 10;
  const randomY = Math.floor(Math.random() * maxY) + 10;
  no.style.left = randomX + "px";
  no.style.top = randomY + "px";
}

no.addEventListener("mouseover", fugirBotao);
no.addEventListener("touchstart", fugirBotao);

// Se ela conseguir burlar o sistema e clicar em "Vou pensar"
no.onclick = () => {
  message.textContent = "Nossa, você é ninja! 🥷 Mas o sistema não aceita 'Não'. Redirecionando... 😂";
  no.textContent = "Me pegou 😅";
  
  // Ela é teimosa, mas manda mensagem no zap do mesmo jeito:
  setTimeout(() => {
    const textoWhatsapp = "Ok, você me venceu no jogo do botão fujão! 😂 Vamos conversar sobre esse jantar.";
    const url = `https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${encodeURIComponent(textoWhatsapp)}`;
    window.location.href = url;
  }, 2500);
};
</script>
</body>
</html>
